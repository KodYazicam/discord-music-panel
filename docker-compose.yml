services:
  panel:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4000}
      DATABASE_PATH: /app/data/database.sqlite
    volumes:
      - panel-data:/app/data
      - panel-logs:/app/logs
    restart: unless-stopped

volumes:
  panel-data:
  panel-logs:
